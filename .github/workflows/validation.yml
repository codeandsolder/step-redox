name: STEP validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz safe cleanup idempotence
        run: cargo +nightly fuzz run clean_idempotent -- -runs=10000 -dict=fuzz/step.dict

      - name: Fuzz solid extrusion recovery
        run: cargo +nightly fuzz run solid_extrusions -- -runs=10000 -dict=fuzz/step.dict

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.88

      - name: Check declared Rust 1.88 MSRV
        run: cargo +1.88.0 check --locked --lib --bins --features cad-kernel-monstertruck

  validate:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validation/requirements.txt

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install validation dependencies
        run: python -m pip install -r validation/requirements.txt

      - name: Run Rust unit tests
        run: cargo test --lib --release --locked

      - name: Validate Monstertruck CAD backend
        run: |
          cargo test --lib --release --locked --features cad-kernel-monstertruck
          cargo clippy --lib --locked --features cad-kernel-monstertruck -- -D warnings

      - name: Validate Monstertruck tooling
        run: |
          cargo clippy --manifest-path tools/step-viewer/Cargo.toml -- -D warnings
          (
            cd experiments/kcl-monstertruck-spike
            cargo run --quiet
            shell_id="$(sed -nE 's/^#([0-9]+)[[:space:]]*=[[:space:]]*CLOSED_SHELL.*/\1/p' box.step | head -n1)"
            test -n "$shell_id"
            cargo run --quiet --manifest-path ../../tools/step-viewer/Cargo.toml -- \
              box.step box.step /tmp/step-redox-monstertruck-viewer-smoke.html --shell "$shell_id"
            test -s /tmp/step-redox-monstertruck-viewer-smoke.html
          )

      - name: Build step-redox
        run: cargo build --release --locked --bin step-redox --bin step-count-resize --bin step-chain-resize

      - name: Cache upstream STEP fixtures
        uses: actions/cache@v4
        with:
          path: .cache/step-redox-validation
          key: step-fixtures-${{ hashFiles('validation/fixtures.json') }}

      - name: Validate geometry and renders
        run: |
          python validation/harness.py run \
            --manifest validation/fixtures.json \
            --cache .cache/step-redox-validation \
            --out validation/out \
            --step-redox target/release/step-redox \
            --step-count-resize target/release/step-count-resize \
            --step-chain-resize target/release/step-chain-resize


      - name: Validate periodic chain recovery
        run: |
          python validation/semantic_probe.py \
            --manifest validation/fixtures.json \
            --cache .cache/step-redox-validation \
            --out validation/out/semantic-probes \
            --step-redox target/release/step-redox

      - name: Publish summary
        if: always()
        run: |
          if [ -f validation/out/summary.md ]; then
            cat validation/out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-validation
          path: validation/out
          if-no-files-found: warn
