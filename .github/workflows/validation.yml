name: STEP validation

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

      - name: Setup canonical sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@47a06568cde470da42ae67a93c8e63966cce1fce # main

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz safe cleanup idempotence
        run: cargo +nightly fuzz run clean_idempotent -- -runs=10000 -dict=fuzz/step.dict

      - name: Fuzz solid extrusion recovery
        run: cargo +nightly fuzz run solid_extrusions -- -runs=10000 -dict=fuzz/step.dict

      - name: Fuzz solid revolution recovery
        run: cargo +nightly fuzz run solid_revolutions -- -runs=10000 -dict=fuzz/step.dict

      - name: Finalize canonical sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@47a06568cde470da42ae67a93c8e63966cce1fce # main

  shared-sccache:
    name: Rust build/test (shared sccache)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@47a06568cde470da42ae67a93c8e63966cce1fce # main
    with:
      command: |
        cargo +1.99.1 test --lib --release --locked
        cargo +1.99.1 test --lib --release --locked --features cad-kernel-monstertruck
        cargo +1.99.1 build --release --locked --bin step-redox --bin step-count-resize --bin step-chain-resize --bin step-revolution-scan --bin step-support-scan
      rust-toolchain: "1.99.1"
      rustflags: "-C target-cpu=x86-64-v2"

  validate:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt

      - name: Setup canonical sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@47a06568cde470da42ae67a93c8e63966cce1fce # main

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Install validation dependencies
        run: uv sync --frozen

      - name: Run Rust unit tests
        run: cargo test --lib --release --locked

      - name: Validate Monstertruck CAD backend
        run: cargo test --lib --release --locked --features cad-kernel-monstertruck

      - name: Validate Monstertruck tooling
        run: |
          cargo clippy --manifest-path tools/step-viewer/Cargo.toml -- -D warnings
          (
            cd experiments/kcl-monstertruck-spike
            cargo run --quiet --features kcl-conformance
            shell_id="$(sed -nE 's/^#([0-9]+)[[:space:]]*=[[:space:]]*CLOSED_SHELL.*/\1/p' box.step | head -n1)"
            test -n "$shell_id"
            cargo run --quiet --manifest-path ../../tools/step-viewer/Cargo.toml -- \
              box.step box.step /tmp/step-redox-monstertruck-viewer-smoke.html --shell "$shell_id"
            test -s /tmp/step-redox-monstertruck-viewer-smoke.html
          )

      - name: Build step-redox
        run: cargo build --release --locked --bin step-redox --bin step-count-resize --bin step-chain-resize --bin step-revolution-scan --bin step-support-scan

      - name: Cache upstream STEP fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/step-redox-validation
          key: step-fixtures-${{ hashFiles('validation/fixtures.json') }}

      - name: Validate geometry and renders
        run: |
          uv run --frozen python validation/harness.py run \
            --manifest validation/fixtures.json \
            --cache .cache/step-redox-validation \
            --out validation/out \
            --step-redox target/release/step-redox \
            --step-count-resize target/release/step-count-resize \
            --step-chain-resize target/release/step-chain-resize


      - name: Validate periodic chain recovery
        run: |
          uv run --frozen python validation/semantic_probe.py \
            --manifest validation/fixtures.json \
            --cache .cache/step-redox-validation \
            --out validation/out/semantic-probes \
            --step-redox target/release/step-redox

      - name: Validate Monstertruck Clippy
        run: |
          cargo clippy --lib --locked --features cad-kernel-monstertruck -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          cargo clippy --bin step-revolution-scan --locked --features cad-kernel-monstertruck -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          cargo clippy --bin step-support-scan --locked --features cad-kernel-monstertruck -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Publish summary
        if: always()
        run: |
          if [ -f validation/out/summary.md ]; then
            cat validation/out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: step-validation
          path: validation/out
          if-no-files-found: warn

      - name: Finalize canonical sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@47a06568cde470da42ae67a93c8e63966cce1fce # main
