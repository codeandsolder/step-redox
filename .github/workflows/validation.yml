name: STEP validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validation/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install validation dependencies
        run: python -m pip install -r validation/requirements.txt

      - name: Run Rust unit tests
        run: cargo test --lib --release

      - name: Build step-redox
        run: cargo build --release --bin step-redox --bin step-count-resize

      - name: Cache upstream STEP fixtures
        uses: actions/cache@v4
        with:
          path: .cache/step-redox-validation
          key: step-fixtures-${{ hashFiles('validation/fixtures.json') }}

      - name: Validate geometry and renders
        run: |
          python validation/harness.py run \
            --manifest validation/fixtures.json \
            --cache .cache/step-redox-validation \
            --out validation/out \
            --step-redox target/release/step-redox \
            --step-count-resize target/release/step-count-resize


      - name: Probe TE semantic count recovery
        if: always()
        run: |
          set -euo pipefail
          mkdir -p validation/out/semantic-probes
          for part in te-3-353293-4 te-3-353293-5 te-3-353293-8; do
            input=".cache/step-redox-validation/${part}.step"
            prefix="validation/out/semantic-probes/${part}"
            target/release/step-redox --profile compact               "$input" "${prefix}.compact.step"               --patterns-json "${prefix}.patterns.json"               --periodic-bodies-json "${prefix}.bodies.json"               --count-parameters-json "${prefix}.counts.json"               --json 2> "${prefix}.stats.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("validation/out/semantic-probes")
          print("TE semantic recovery summary")
          for stats_path in sorted(root.glob("*.stats.json")):
              stem = stats_path.name.removesuffix(".stats.json")
              patterns = json.loads((root / f"{stem}.patterns.json").read_text())
              bodies = json.loads((root / f"{stem}.bodies.json").read_text())
              counts = json.loads((root / f"{stem}.counts.json").read_text())
              print(
                  stem,
                  "patterns=", len(patterns),
                  "pattern_sizes=", [len(x["item_ids"]) for x in patterns],
                  "bodies=", len(bodies),
                  "body_sites=", [x["sites"] for x in bodies],
                  "counts=", len(counts),
                  "count_sites=", [x["sites"] for x in counts],
                  "proven=", [x["body_grammar_proven"] for x in counts],
              )
          PY

      - name: Publish summary
        if: always()
        run: |
          if [ -f validation/out/summary.md ]; then
            cat validation/out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-validation
          path: validation/out
          if-no-files-found: warn
