[package]
name = "step-redox"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[features]
default = []
cad-kernel-monstertruck = ["dep:monstertruck-modeling", "dep:monstertruck-io"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.41"
ruststep = { package = "step-p21", version = "0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
monstertruck-modeling = { version = "0.4.1", optional = true }
monstertruck-io = { version = "0.4.1", optional = true }
