[package]
name = "step-redox-viewer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ruststep = { package = "step-p21", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
monstertruck-io = { version = "0.4.1", features = ["step"] }
monstertruck-meshing = "0.4.1"
monstertruck-mesh = "0.4.1"
monstertruck-topology = "0.4.1"
